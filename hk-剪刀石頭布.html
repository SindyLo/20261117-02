<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hk-剪刀石頭布</title>
    <link rel="stylesheet" href="./css/hk-剪刀石頭布.css">
</head>

<body>
    <div class="all">
        <div class="top">
            <div class="img">✊</div>
            <div class="title">猜拳</div>
            <div class="text">選擇剪刀、石頭或布，和電腦一決勝負</div>
        </div>
        <div class="mid">
            <div class="self">
                <div class="self-text">你</div>
                <div class="self-result">✊</div>
            </div>
            <div class="computer">
                <div class="computer-text">電腦</div>
                <div class="computer-result">✊</div>
            </div>
        </div>
        <!-- <div class="score">你贏了</div> -->
        <div class="btm">
            <div class="btn-area">
                <button type="button" class="scissors">✌️</button>
                <button type="button" class="rock"> ✊</button>
                <button type="button" class="paper"> ✋</button>
            </div>
        </div>
        <div class="record"></div>
    </div>
</body>

</html>
